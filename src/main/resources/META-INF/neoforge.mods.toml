modLoader = "javafml"
loaderVersion = "[4,)" # Specifies NeoForge 4.x+ for 1.21+
license = "${mod_license}"

[modproperties.phoenix_chromatic_codes]
mixinExtrasVersion = "0.4.1"

[[mods]]
modId = "phoenix_chromatic_codes"
version = "1.10"
displayName = "PhoenixChromaticCodes"
displayURL = "${mod_url}"
authors = "${mod_author}"
description = '''A mod focused on adding custom color codes and effects.'''
# --- MIXIN CONFIGURATIONS ---

[[mixins]]
config = "phoenix_chromatic_codes.mixins.json"

# --- REQUIRED DEPENDENCIES ---

[[dependencies.phoenix_chromatic_codes]]
modId = "neoforge"
type = "required" # Replaced mandatory = true
versionRange = "[21.1,)" # Targets NeoForge 1.21.1+
ordering = "NONE"
side = "BOTH"

[[dependencies.phoenix_chromatic_codes]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]" # Explicitly locks to 1.21.1 runtime boundary
ordering = "NONE"
side = "BOTH"

[[dependencies.phoenix_chromatic_codes]]
modId = "configuration"
type = "required"
versionRange = "[3.0,)"
ordering = "NONE"
side = "BOTH"

# --- OPTIONAL DEPENDENCIES ---

[[dependencies.phoenix_chromatic_codes]]
modId = "architectury"
type = "optional" # Replaced mandatory = false
versionRange = "[${architectury_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.phoenix_chromatic_codes]]
modId = "ftblibrary"
type = "optional"
versionRange = "[${ftblibrary_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.phoenix_chromatic_codes]]
modId = "ftbteams"
type = "optional"
versionRange = "[${ftbteams_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.phoenix_chromatic_codes]]
modId = "ftbquests"
type = "optional"
versionRange = "[${ftbquests_version},)"
ordering = "NONE"
side = "BOTH"