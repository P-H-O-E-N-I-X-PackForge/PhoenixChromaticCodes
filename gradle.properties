# Done to increase the memory available to gradle.
# Modern Gradle and Java 21 development generally benefit from more than 1G.
org.gradle.jvmargs=-Xmx3G -XX:+UseG1GC

# Java Toolchain Target
targetCompatibility=21
sourceCompatibility=21

# Base properties
minecraft_version=1.21.1
neoforge_version=21.1.65

# Parchment Mappings for 1.21.1
# Note: In the new buildscript, we split this into separate mapping and MC version properties
parchment_mapping_version=2024.11.17
parchment_minecraft_version=1.21.1

# Mod Properties
mod_version=0.1.0-neoforge
maven_group=net.phoenix.chromatic_codes
archives_base_name=chromatic_codes
mod_id=phoenix_chromatic_codes
mod_name=PhoenixChromaticColors
mod_url=
mod_author=Phoenixvine
mod_license=LGPLv3.0

# Dependencies (Update these values to the specific versions you download for NeoForge 1.21.1)
# Change this line:

architectury_version=13.0.8
ftblibrary_version=2101.1.31
ftbteams_version=2101.1.2
ftbquests_version=2101.1.19

# Optional additions if you still use JEI/EMI on 1.21.1
jei_version=19.21.0.246
emi_version=1.4.3