plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.diffplug.spotless' version '7.0.2'
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }

// 1.21.1 requires Java 21
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Modern NeoForge Configuration block
neoForge {
    version = project.neoforge_version // Expected format e.g., 21.1.65

    parchment {
        mappingsVersion = project.parchment_mapping_version // e.g. 2024.07.28
        minecraftVersion = project.parchment_minecraft_version // 1.21.1
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty 'mixin.debug.export', 'true'
        }
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name = 'FirstDarkDev'
        url = "https://maven.firstdark.dev/snapshots/"
    }
    maven {
        name = 'Configuration'
        url = 'https://repo.repsy.io/mvn/toma/public/'
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        url = "https://maven.tterrag.com/"
        content { includeGroup "com.tterrag.registrate" }
    }
    maven {
        name = "ftbMavenReleases"
        url = "https://maven.ftb.dev/releases"
    }
    maven {
        url = "https://maven.architectury.dev"
    }
}

dependencies {
    compileOnly("org.jetbrains:annotations:26.0.1")
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"

    implementation("curse.maven:configuration-444699:6779573")
    jarJar("curse.maven:configuration-444699:6779573")

    compileOnly("dev.architectury:architectury-neoforge:${architectury_version}")

    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}")
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftbteams_version}")
    compileOnly("dev.ftb.mods:ftb-quests-neoforge:${ftbquests_version}")

    compileOnly("curse.maven:modern-ui-352491:6956345")

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
}

apply from: "$rootDir/gradle/scripts/spotless.gradle"

tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license": mod_license,
            "mod_id": mod_id,
            "version": version,
            "mod_name": mod_name,
            "mod_url": mod_url,
            "mod_author": mod_author,
            "neoforge_version": neoforge_version,
            "minecraft_version": minecraft_version,
            "architectury_version": architectury_version,
            "ftblibrary_version": ftblibrary_version,
            "ftbteams_version": ftbteams_version,
            "ftbquests_version": ftbquests_version
    ]
    inputs.properties(properties)

    filesMatching("META-INF/neoforge.mods.toml") {
        expand properties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(21) // Target Java 21 compiled bytecode
    options.compilerArgs << "-Aquiet=true"


}
